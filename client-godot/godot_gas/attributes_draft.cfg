; GodotGAS attribute drafts. Edit in the GodotGAS dashboard (Attribute Sets tab), then Generate.
; Unit: the one AttributeSet shared by characters and enemies. Defaults are from specs/design/combat-design.md and
; are stored x100 (hp 1000 -> 100000, crit_rate 5% -> 500). Units overwrite them from their stats anyway.
; snake_case like the dashboard: Generate clamps each x to [0, max_x] (hp, mp, energy, toughness). The combat code
; reads hp, max_hp, mp, max_mp, spd and energy by these names. Other clamps: content/demo/attributes/demo_unit_attributes.gd.

[Unit]

