global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Rpg.GameServerApi runs on the host during dev. Keep this port in sync with
  # src/Rpg.GameServerApi/Properties/launchSettings.json once the project exists.
  - job_name: 'rpg-game-server-api'
    static_configs:
      - targets: ['host.docker.internal:5000']

  # The verifier worker (spec battle-verify 5): on the host during dev, port from src/Rpg.VerifierWorker/appsettings.json.
  - job_name: 'rpg-verifier-worker'
    static_configs:
      - targets: ['host.docker.internal:5100']
